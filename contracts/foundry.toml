[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
# Metis Andromeda and Metis Sepolia run PUSH0 but reject Cancun opcodes
# (TSTORE, MCOPY) and BASEFEE, so nothing here may target Cancun.
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[rpc_endpoints]
metis = "${METIS_RPC_URL}"
metis_sepolia = "${METIS_SEPOLIA_RPC_URL}"

[fmt]
line_length = 110
