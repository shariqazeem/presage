[package]
name = "parallaxpay-vault"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
description = "ParallaxPay agent vault on NEAR: users fund it, set the rules, and the agent trades within them."
license = "MIT"
repository = "https://github.com/shariqazeem/presage"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.27.0"

[dev-dependencies]
near-sdk = { version = "=5.27.0", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
