name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  vault:
    name: Vault contract tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: near/vault
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins 1.86.0, the newest rustc whose wasm NEAR accepts for near-sdk 5.27.
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: near/vault
      - run: cargo test

  app:
    name: Type-check the app and the agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # next-env.d.ts is generated by Next and not committed; the type references are all tsc needs.
      - run: printf '/// <reference types="next" />\n/// <reference types="next/image-types/global" />\n' > next-env.d.ts
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npx tsc --noEmit -p tsconfig.engine.json
